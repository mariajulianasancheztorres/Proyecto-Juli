      }

      function updateProductFilterUrl() {
        const query = new URLSearchParams();
        if (activeCategory !== "all") query.set("categoria", activeCategory);
        if (activeSpecies !== "all") query.set("especie", activeSpecies);
        if (activeLifeStage !== "all") query.set("etapa", activeLifeStage);
        history.replaceState(
          null,
          "",
          `tienda.html${query.size ? `?${query}` : ""}`,
        );
      }

      function showWishlist() {
        showingWishlist = true;
        document.querySelectorAll(".product-filter").forEach((button) => {
          button.classList.remove("active", "bg-paw-petrol", "text-white");
          button.classList.add("bg-white", "text-gray-600");
        });
        history.replaceState(null, "", "tienda.html?vista=deseos");
        renderProducts();
        document.getElementById("product-grid").scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      function renderProducts() {
        if (activeCategory === "higiene" && activeSpecies === "otras-especies") {
          activeSpecies = "all";
        }
        const categoryProducts = showingWishlist
          ? products.filter((product) => wishlist.includes(product.id))
          : activeCategory === "ofertas"
            ? products.filter((product) => product.offer || product.discount)
          : activeCategory === "all"
            ? products
            : products.filter(
                (product) => product.category.toLowerCase() === activeCategory,
              );
        let visible = categoryProducts;
        if (!showingWishlist && activeSpecies !== "all") {
          visible = visible.filter((product) =>
            product.species?.includes(activeSpecies),
          );
        }
        if (!showingWishlist && activeLifeStage !== "all") {
          visible = visible.filter(
            (product) => product.lifeStage === activeLifeStage,
          );
        }
        document
          .getElementById("species-filter-area")
          .classList.toggle("hidden", showingWishlist || activeCategory === "ofertas");
        document
          .getElementById("other-species-filter")
          .classList.toggle(
            "hidden",
            activeCategory === "camas" ||
              activeCategory === "higiene" ||
              activeCategory === "paseo",
          );
        updateLifeStageDropdowns();
        document.querySelectorAll(".food-species-filter").forEach((button) => {
          const selected = button.dataset.species === activeSpecies;
          button.classList.toggle("active", selected);
          button.classList.toggle("text-paw-petrol", selected);
          button.classList.toggle("text-gray-500", !selected);
          button.setAttribute("aria-pressed", selected);
          button
            .querySelector(".species-filter-indicator")
            .classList.toggle("scale-x-100", selected);
        });
        document.querySelectorAll(".life-stage-filter").forEach((button) => {
          const selectedForSpecies =
            button.dataset.lifeStage === activeLifeStage &&
            ((activeSpecies === "perros" &&
              button.closest("#dog-life-stage-filters")) ||
              (activeSpecies === "gatos" &&
                button.closest("#cat-life-stage-filters")));
          button.setAttribute("aria-pressed", Boolean(selectedForSpecies));
          button.classList.toggle("bg-paw-bg", Boolean(selectedForSpecies));
          button.classList.toggle("font-semibold", Boolean(selectedForSpecies));
          button.classList.toggle("text-paw-petrol", Boolean(selectedForSpecies));
        });
        document.getElementById("product-heading").textContent = showingWishlist
          ? "Mis deseos"
          : activeCategory === "ofertas"
            ? "Ofertas"
          : "Productos";
        document.getElementById("product-count").textContent =
          `${visible.length} producto${visible.length === 1 ? "" : "s"}`;
        if (showingWishlist && visible.length === 0) {
          document.getElementById("product-grid").innerHTML =
            '<p class="col-span-full text-center text-gray-500 py-10">Todavía no guardaste productos en Deseos.</p>';
          return;
        }
        if (visible.length === 0) {
          document.getElementById("product-grid").innerHTML =
            `<p class="col-span-full text-center text-gray-500 py-10">Todavía no hay productos${activeLifeStage !== "all" ? " para esta etapa" : activeSpecies !== "all" ? " para esta especie" : ""}.</p>`;
          return;
        }
        document.getElementById("product-grid").innerHTML = visible
          .map(
            (product) => {
              const isSaved = wishlist.includes(product.id);
              return `
                <article class="group bg-white rounded-3xl p-4 flex flex-col shadow-sm border border-gray-100 hover:shadow-xl transition">
                    <div class="relative ${product.species?.includes("gatos") || product.id === 137 ? "bg-white" : "bg-gray-50"} rounded-2xl aspect-square mb-4 overflow-hidden">
                        ${
                          product.image
                            ? `<img src="${product.image}" alt="${product.name}" class="w-full h-full ${product.category === "Camas" || product.species?.includes("gatos") || product.id === 135 ? "object-contain" : "object-cover group-hover:scale-105"} transition-transform duration-500">`
                            : `<div role="img" aria-label="Imagen de ${product.name} próximamente" class="w-full h-full flex flex-col items-center justify-center gap-3 bg-paw-card text-paw-accent">
                                <svg class="w-16 h-16" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                                  <path d="M12 34h40l-5 17H17l-5-17Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
                                  <path d="M8 31c0-2 2-4 4-4h40c2 0 4 2 4 4v3H8v-3Z" fill="currentColor" opacity=".22" stroke="currentColor" stroke-width="2.5"/>
                                  <circle cx="25" cy="19" r="4" fill="currentColor"/>
                                  <circle cx="36" cy="16" r="4" fill="currentColor"/>
                                  <circle cx="45" cy="22" r="4" fill="currentColor"/>
                                </svg>
                                <span class="text-xs font-semibold tracking-wide">Imagen próximamente</span>
                              </div>`
                        }
                        ${
                          product.brandLogo
                            ? `<img src="assets/logo-huellita.png" alt="" aria-hidden="true" class="pointer-events-none absolute ${product.brandLogoPosition === "bottom-right" ? "bottom-2 right-2" : "bottom-2 left-2"} z-[1] h-6 w-6 object-contain opacity-75 drop-shadow-sm sm:h-7 sm:w-7">`
                            : ""
                        }
                        ${
                          product.discount
                            ? `<span class="absolute left-3 top-3 z-10 rounded-full bg-red-500 px-3 py-1 text-xs font-bold text-white shadow-sm">${product.discount}% OFF</span>`
                            : ""
                        }
                        <button
                          type="button"
                          onclick="toggleWishlist(${product.id})"
                          aria-label="${isSaved ? "Quitar de" : "Agregar a"} Deseos: ${product.name}"
                          aria-pressed="${isSaved}"
                          class="absolute top-3 right-3 w-9 h-9 bg-white/90 backdrop-blur rounded-full flex items-center justify-center transition-all z-10 shadow-sm hover:scale-110"
                        >
                          <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true" fill="${isSaved ? "#f4a7a7" : "none"}" stroke="#d94b4b" stroke-width="2.2">
                            <path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 0 1 6.5 4c1.74 0 3.41.81 4.5 2.09A6.06 6.06 0 0 1 15.5 4 4.5 4.5 0 0 1 20 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z" />
                          </svg>
                        </button>
                    </div>
                    <h3 class="font-bold text-gray-900 leading-snug mb-2">${product.name}</h3>
                    ${
                      product.rating != null
                        ? `<div class="flex items-center gap-1 mb-4">${stars(product.rating)} <span class="text-[10px] text-gray-400">(${product.reviews})</span></div>`
                        : ""
                    }
                    <div class="mt-auto pt-3 border-t border-gray-100">
                        ${
                          product.price == null
                            ? `<p class="py-2 text-sm font-medium text-gray-500">${product.weight == null ? "Peso y precio próximamente" : "Precio próximamente"}</p>`
                            : `<p class="mb-1 text-sm text-gray-500">${product.weight ?? ""}</p>
                            ${product.originalPrice ? `<span class="mr-2 text-sm text-gray-400 line-through">${money(product.originalPrice)}</span>` : ""}
                            <strong class="text-lg block mb-3">${money(product.price)}</strong>
                        ${
                          product.available === false
                            ? `<button type="button" disabled aria-label="${product.name}: sin stock" class="w-full bg-gray-100 text-gray-400 font-bold py-2.5 rounded-xl border border-gray-200 cursor-not-allowed">SIN STOCK</button>`
                            : `<button onclick="addToCart(${product.id})" class="w-full bg-green-50 hover:bg-paw-accent hover:text-white text-paw-accent font-bold py-2.5 rounded-xl border border-green-200 transition">🛒 AGREGAR</button>`
                        }`
                        }
                    </div>
                </article>`;
            },
          )
          .join("");
      }

      function toggleWishlist(id) {
        wishlist = wishlist.includes(id)
          ? wishlist.filter((savedId) => savedId !== id)
          : [...wishlist, id];
        try {
          localStorage.setItem(wishlistStorageKey, JSON.stringify(wishlist));
        } catch (error) {
          console.error("No se pudo guardar la lista de deseos.", error);
          alert("No se pudo guardar el producto en Deseos. Revisá la configuración del navegador.");
        }
        renderProducts();
      }

      function addToCart(id) {
        const product = products.find((item) => item.id === id);
        if (!product) {
          console.error("No se encontró el producto para agregar al carrito.", id);
          return;
        }
        if (product.available === false) {
          console.warn(`El producto "${product.name}" no tiene stock.`);
          return;
        }
        const existing = cart.find((item) => item.id === id);
        existing ? existing.qty++ : cart.push({ ...product, qty: 1 });
        updateCart();
        toggleCart(true);
      }

      function updateCart() {
        document.getElementById("cart-counter").textContent = cart.reduce(
          (sum, item) => sum + item.qty,
          0,
        );
        document.getElementById("cart-items").innerHTML = cart.length
          ? cart
              .map(
                (item) => `
                <div class="flex gap-3 bg-white p-3 rounded-xl">
                    <img src="${item.image}" alt="" class="w-16 h-16 rounded-lg object-cover">
                    <div class="flex-1"><strong class="text-sm">${item.name}</strong><p>${item.qty} x ${money(item.price)}</p></div>
                    <button onclick="removeItem(${item.id})" class="text-red-400">×</button>
                </div>`,
              )
              .join("")
          : '<p class="text-center text-gray-500 py-10">Tu carrito está vacío.</p>';
        document.getElementById("cart-total").textContent = money(
          cart.reduce((sum, item) => sum + item.price * item.qty, 0),
        );
      }

      function removeItem(id) {
        cart = cart.filter((item) => item.id !== id);
        updateCart();
      }
      function toggleCart(forceOpen = null) {
        const drawer = document.getElementById("cart-drawer"),
          overlay = document.getElementById("cart-overlay");
        const open =
          forceOpen === null
            ? drawer.classList.contains("translate-x-full")
            : forceOpen;
        drawer.classList.toggle("translate-x-full", !open);
        overlay.classList.toggle("hidden", !open);
        requestAnimationFrame(() =>
          overlay.classList.toggle("opacity-0", !open),
        );
      }
      function checkoutWhatsApp() {
        if (!cart.length) return;
        const text = cart
          .map(
            (item) =>
              `${item.qty}x ${item.name} - ${money(item.price * item.qty)}`,
          )
          .join("\n");
        window.open(
          `https://wa.me/?text=${encodeURIComponent(`Hola! Quisiera realizar este pedido:\n\n${text}`)}`,
          "_blank",
        );
      }
      document
        .querySelectorAll("#product-filters [data-filter]")
        .forEach((button) =>
          button.addEventListener("click", () => {
            filterProducts(button.dataset.filter);
            const query = new URLSearchParams({
              ...(button.dataset.filter === "all"
                ? {}
                : { categoria: button.dataset.filter }),
              ...(activeSpecies === "all" ? {} : { especie: activeSpecies }),
              ...(activeLifeStage === "all"
                ? {}
                : { etapa: activeLifeStage }),
            });
            history.replaceState(
              null,
              "",
              `tienda.html${query.size ? `?${query}` : ""}`,
            );
          }),
        );
      document
        .querySelectorAll("#food-species-filters [data-species]")
        .forEach((button) =>
          button.addEventListener("click", () =>
            filterFoodSpecies(button.dataset.species),
          ),
        );
      document.querySelectorAll(".life-stage-dropdown").forEach((wrapper) => {
        const species = wrapper.dataset.speciesDropdown;
        wrapper.addEventListener("pointerenter", () => {
          dismissedLifeStageDropdowns.delete(species);
          updateLifeStageDropdowns();
        });
        wrapper.addEventListener("pointerleave", updateLifeStageDropdowns);
        wrapper.addEventListener("focusin", (event) => {
          if (!wrapper.contains(event.relatedTarget)) {
            dismissedLifeStageDropdowns.delete(species);
          }
          updateLifeStageDropdowns();
        });
        wrapper.addEventListener("focusout", () =>
          setTimeout(() => {
            if (!wrapper.contains(document.activeElement)) {
              dismissedLifeStageDropdowns.delete(species);
            }
            updateLifeStageDropdowns();
          }, 0),
        );
      });
      document
        .querySelectorAll(".life-stage-filter[data-life-stage]")
        .forEach((button) =>
          button.addEventListener("click", () =>
            filterLifeStage(button.dataset.lifeStage),
          ),
        );
      if (showingWishlist) {
        showWishlist();
      } else {
        filterProducts(activeCategory);
        if (foodSpeciesFilters.includes(initialSpecies)) {
          filterFoodSpecies(initialSpecies);
          if (
            activeCategory === "alimento" &&
            lifeStagesBySpecies[initialSpecies]?.includes(initialLifeStage)
          ) {
            filterLifeStage(initialLifeStage);
          }
        }
      }
      updateCart();
    </script>
  </body>
</html>
